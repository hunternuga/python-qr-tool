apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qr-app
  template:
    metadata:
      labels:
        app: qr-app
    spec:
      containers:
      - name: qr-app
        image: qr-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: qr-app-service
spec:
  type: NodePort
  selector:
    app: qr-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30000
